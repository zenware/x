<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebAPI Playground</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">WebAPI Playground</p>
        <h1>Small browser-native examples for mainstream Web APIs.</h1>
        <p class="lede">
          Open this page from a secure origin to try APIs like Canvas, Beacon, Badging, Clipboard,
          Notifications, Geolocation, Wake Lock, Device Posture, Storage, Share, and Background Fetch.
        </p>
        <p class="note" id="environment-note"></p>
      </header>

      <section class="controls">
        <button id="clear-log" type="button">Clear activity log</button>
      </section>

      <section class="layout">
        <section>
          <h2>API demos</h2>
          <div id="demo-grid" class="grid"></div>
        </section>

        <aside class="panel">
          <h2>Activity log</h2>
          <pre id="activity-log" class="log" aria-live="polite"></pre>
        </aside>
      </section>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
