{{define "repos/blob.html"}}{{template "layout" .}}{{end}}
{{define "repos/blob.content"}}
<div class="space-y-6">
  <div>
    <a href="/repos/{{.Repository.Name}}/tree/{{.Ref}}" class="text-sm text-indigo-300 hover:text-indigo-200">← Back to tree</a>
    <h1 class="mt-2 text-3xl font-semibold">{{.FilePath}}</h1>
    <p class="mt-2 text-sm text-slate-400">Revision {{.Ref}}</p>
  </div>
  <pre class="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900 p-6 text-sm text-slate-200">{{.Content}}</pre>
</div>
{{end}}
