{{define "repos/blob.html"}}{{template "layout" .}}{{end}}
{{define "repos/blob.content"}}
<div class="space-y-6">
  <div>
    <a href="/repos/{{.Repository.Name}}/tree/{{.Ref}}" class="text-sm text-indigo-300 hover:text-indigo-200">← Back to tree</a>
    <h1 class="mt-2 text-3xl font-semibold">{{.FilePath}}</h1>
    <p class="mt-2 text-sm text-slate-400">Revision {{.Ref}}</p>
  </div>
  <nav class="flex flex-wrap gap-2 text-sm">
    <a href="/repos/{{.Repository.Name}}" class="rounded-lg border border-slate-700 px-4 py-2 hover:bg-slate-800">Overview</a>
    <a href="/repos/{{.Repository.Name}}/log" class="rounded-lg border border-slate-700 px-4 py-2 hover:bg-slate-800">Revisions</a>
    <a href="/repos/{{.Repository.Name}}/tree/{{.Ref}}" class="rounded-lg bg-slate-800 px-4 py-2 text-slate-100">Browse files</a>
    <a href="/repos/{{.Repository.Name}}/changes" class="rounded-lg border border-slate-700 px-4 py-2 hover:bg-slate-800">Change requests</a>
    <a href="/repos/{{.Repository.Name}}/pipelines" class="rounded-lg border border-slate-700 px-4 py-2 hover:bg-slate-800">Pipelines</a>
  </nav>
  <pre class="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900 p-6 text-sm text-slate-200">{{.Content}}</pre>
</div>
{{end}}
