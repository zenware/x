{{define "changes/new.html"}}{{template "layout" .}}{{end}}
{{define "changes/new.content"}}
<div class="max-w-3xl space-y-6">
  <div>
    <a href="/repos/{{.Repository.Name}}/changes" class="text-sm text-indigo-300 hover:text-indigo-200">← Back to change requests</a>
    <h1 class="mt-2 text-3xl font-semibold">New change request</h1>
    <p class="mt-2 text-sm text-slate-400">Open a review from one bookmark to another.</p>
  </div>
  <form method="post" action="/repos/{{.Repository.Name}}/changes" class="space-y-4 rounded-xl border border-slate-800 bg-slate-900 p-6">
    <div>
      <label class="block text-sm font-medium text-slate-300">Title</label>
      <input type="text" name="title" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-300">Description</label>
      <textarea name="description" rows="6" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm"></textarea>
    </div>
    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label class="block text-sm font-medium text-slate-300">Source bookmark</label>
        <select name="source_bookmark" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm">
          {{range .Bookmarks}}<option value="{{.}}">{{.}}</option>{{end}}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300">Target bookmark</label>
        <select name="target_bookmark" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm">
          {{range .Bookmarks}}<option value="{{.}}">{{.}}</option>{{end}}
        </select>
      </div>
    </div>
    <button type="submit" class="rounded-lg bg-indigo-500 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-400">Create change request</button>
  </form>
</div>
{{end}}
