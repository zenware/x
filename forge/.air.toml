root = "."
tmp_dir = "bin/.air"

[build]
  cmd = "go build -o bin/forge ./cmd/forge && ./bin/forge"
  bin = "bin/forge"
  include_ext = ["go", "html"]
  exclude_dir = ["bin", "data"]
  delay = 500
  stop_on_error = true

[color]
  main = "cyan"
  watcher = "yellow"
  build = "green"
  runner = "magenta"
